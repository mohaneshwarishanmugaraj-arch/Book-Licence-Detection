<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Metadata & Full-Content Book Search</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-purple: #8b5cf6;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .search-panel {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .input-group {
            flex: 1;
            min-width: 280px;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.3);
        }

        .filter-group select {
            padding: 0.9rem 1.2rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            cursor: pointer;
            min-width: 200px;
        }

        .btn-search {
            padding: 0.9rem 1.8rem;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .btn-search:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            color: var(--text-muted);
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .book-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 1.5rem;
            backdrop-filter: blur(8px);
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .book-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-purple);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .book-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.3rem;
            word-break: break-word;
        }

        .book-filename {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-family: monospace;
        }

        .badge-license {
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.4);
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge-license.copyright {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border-color: rgba(239, 68, 68, 0.4);
        }

        .badge-license.open {
            background: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
            border-color: rgba(16, 185, 129, 0.4);
        }

        .snippet-box {
            background: rgba(15, 23, 42, 0.6);
            border-left: 4px solid var(--accent-blue);
            padding: 0.8rem;
            border-radius: 6px;
            font-size: 0.88rem;
            color: #e2e8f0;
            margin: 0.8rem 0;
            max-height: 110px;
            overflow-y: auto;
            line-height: 1.4;
        }

        .snippet-box mark {
            background: #f59e0b;
            color: #0f172a;
            padding: 0.1rem 0.3rem;
            border-radius: 3px;
            font-weight: 600;
        }

        .meta-list {
            list-style: none;
            margin: 0.8rem 0;
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        .meta-list li {
            margin-bottom: 0.3rem;
            display: flex;
            justify-content: space-between;
        }

        .meta-label {
            color: var(--text-muted);
        }

        .card-footer {
            margin-top: 1rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-action {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #93c5fd;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            background: rgba(59, 130, 246, 0.4);
            color: white;
        }

        .btn-read {
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            color: white;
            font-weight: 600;
        }

        .btn-read:hover {
            opacity: 0.9;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid var(--card-border);
            border-radius: 16px;
            width: 90%;
            max-width: 900px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-header {
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            color: #f1f5f9;
            line-height: 1.6;
            white-space: pre-wrap;
            font-size: 0.95rem;
        }

        pre {
            background: #0f172a;
            padding: 1rem;
            border-radius: 8px;
            color: #38bdf8;
            font-size: 0.85rem;
            overflow-x: auto;
            white-space: pre-wrap;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .close-btn:hover {
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="search-panel" style="margin-top: 1rem;">

            <div class="input-group">
                <input type="text" id="searchInput" placeholder="Search book text, topics, keywords, authors..." onkeyup="if(event.key==='Enter') performSearch()">
            </div>
            <div class="filter-group">
                <select id="licenseFilter" onchange="performSearch()">
                    <option value="">All Licenses</option>
                </select>
            </div>
            <button class="btn-search" onclick="performSearch()">Search Books</button>
        </div>

        <div class="results-header">
            <span id="resultsCount">Loading books...</span>
            <span>Database: PostgreSQL</span>
        </div>

        <div id="resultsGrid" class="results-grid"></div>
    </div>

    <!-- Book Reader / JSON Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Book View</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        let currentBooks = [];

        async function loadLicenses() {
            try {
                const res = await fetch('/api/licenses');
                const data = await res.json();
                const select = document.getElementById('licenseFilter');
                if (data.licenses) {
                    data.licenses.forEach(lic => {
                        const opt = document.createElement('option');
                        opt.value = lic;
                        opt.textContent = lic;
                        select.appendChild(opt);
                    });
                }
            } catch (err) {
                console.error("Failed to load licenses:", err);
            }
        }

        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const license = document.getElementById('licenseFilter').value;
            const grid = document.getElementById('resultsGrid');
            const countLabel = document.getElementById('resultsCount');

            grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 2rem; color: #94a3b8;">Searching PostgreSQL database for matching book content...</div>';

            try {
                const res = await fetch(`/api/search?query=${encodeURIComponent(query)}&license=${encodeURIComponent(license)}`);
                const data = await res.json();

                if (data.error) {
                    grid.innerHTML = `<div style="grid-column: 1/-1; color: #f87171; text-align:center;">${data.error}</div>`;
                    countLabel.textContent = '0 books found';
                    return;
                }

                currentBooks = data.books || [];
                countLabel.textContent = `Found ${currentBooks.length} matching book(s)`;

                if (currentBooks.length === 0) {
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 3rem; color: #94a3b8;">No matching books found in database for your search query.</div>';
                    return;
                }

                grid.innerHTML = currentBooks.map((b, idx) => {
                    const lic = b.license_detected || 'Unknown';
                    let badgeClass = 'badge-license';
                    if (lic.toLowerCase().includes('rights reserved') || lic.toLowerCase().includes('copyright')) {
                        badgeClass += ' copyright';
                    } else if (lic.toLowerCase().includes('creative commons') || lic.toLowerCase().includes('mit') || lic.toLowerCase().includes('apache')) {
                        badgeClass += ' open';
                    }

                    // Highlight matching search snippet
                    let snippet = escapeHtml(b.matching_snippet || b.text_sample || '');
                    if (query) {
                        const regex = new RegExp(`(${escapeRegExp(query)})`, 'gi');
                        snippet = snippet.replace(regex, '<mark>$1</mark>');
                    }

                    return `
                        <div class="book-card">
                            <div>
                                <div class="card-header">
                                    <div>
                                        <div class="book-title">📖 ${escapeHtml(b.title || b.filename)}</div>
                                        <div class="book-filename">📄 ${escapeHtml(b.filename)}</div>
                                    </div>
                                    <span class="${badgeClass}">${escapeHtml(lic)}</span>
                                </div>
                                <div class="snippet-box">
                                    <strong>Content Match:</strong><br>
                                    ${snippet}
                                </div>
                                <ul class="meta-list">
                                    <li><span class="meta-label">Author:</span> <span>${escapeHtml(b.author || 'N/A')}</span></li>
                                    <li><span class="meta-label">File Size:</span> <span>${(b.file_size_bytes / 1024 / 1024).toFixed(2)} MB</span></li>
                                    <li><span class="meta-label">Processed:</span> <span>${new Date(b.processed_at).toLocaleDateString()}</span></li>
                                </ul>
                            </div>
                            <div class="card-footer">
                                <button class="btn-action btn-read" onclick="openReader(${idx})">📖 Read Book</button>
                                <button class="btn-action" onclick="openJsonModal(${idx})">View JSON</button>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error("Search failed:", err);
                grid.innerHTML = '<div style="grid-column: 1/-1; color: #f87171; text-align:center;">Failed to connect to search API.</div>';
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        async function openReader(index) {
            const book = currentBooks[index];
            if (!book) return;

            document.getElementById('modalTitle').textContent = `📖 Reading: ${book.filename}`;
            document.getElementById('modalBody').innerHTML = '<div style="text-align:center; padding:2rem;">Loading full book text...</div>';
            document.getElementById('modal').style.display = 'flex';

            try {
                const res = await fetch(`/api/book/${encodeURIComponent(book.filename)}`);
                const data = await res.json();
                if (data.book && (data.book.full_text || data.book.text_sample)) {
                    let content = escapeHtml(data.book.full_text || data.book.text_sample);
                    const query = document.getElementById('searchInput').value.trim();
                    if (query) {
                        const regex = new RegExp(`(${escapeRegExp(query)})`, 'gi');
                        content = content.replace(regex, '<mark style="background:#f59e0b; color:#0f172a; padding:0.1rem 0.3rem; border-radius:3px; font-weight:bold;">$1</mark>');
                    }
                    document.getElementById('modalBody').innerHTML = `<div style="font-family: sans-serif; white-space: pre-wrap; line-height: 1.6; font-size: 1rem;">${content}</div>`;
                } else {
                    document.getElementById('modalBody').innerHTML = '<div style="color:#f87171;">Book text content unavailable.</div>';
                }
            } catch (err) {
                document.getElementById('modalBody').innerHTML = '<div style="color:#f87171;">Failed to load book content.</div>';
            }
        }

        function openJsonModal(index) {
            const book = currentBooks[index];
            if (!book) return;

            document.getElementById('modalTitle').textContent = `JSON Payload: ${book.filename}`;
            const payload = {
                metadata: book.raw_metadata || book,
                license_detection: book.license_detection || {},
                processed_at: book.processed_at
            };
            document.getElementById('modalBody').innerHTML = `<pre>${escapeHtml(JSON.stringify(payload, null, 4))}</pre>`;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadLicenses();
            performSearch();
        });
    </script>
</body>
</html>
